<p-card header="Personnes" class="liste">
  @if (chargement()) {
    <p-progressbar mode="indeterminate" [style]="{ height: '4px' }" />
  }

  @if (erreur()) {
    <p-message severity="error">Impossible de charger les personnes.</p-message>
  }

  <p-table
    [value]="personnes()"
    [lazy]="true"
    [paginator]="true"
    [totalRecords]="total()"
    [rows]="size()"
    [first]="first()"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showFirstLastIcon]="true"
    [loading]="chargement()"
    dataKey="id"
    (onPage)="onPage($event)"
  >
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-p>
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.prenom }}</td>
        <td>{{ p.nom }}</td>
        <td>
          <a
            pButton
            [text]="true"
            severity="secondary"
            [routerLink]="['/personnes', p.id]"
            aria-label="Éditer la personne"
          >
            <i class="pi pi-pencil"></i>
          </a>

          <button
            pButton
            type="button"
            [text]="true"
            severity="danger"
            aria-label="Supprimer la personne"
            (click)="confirmerSuppression(p)"
          >
            <i class="pi pi-trash"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">Aucune personne à afficher.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-confirmdialog />
  <ng-template #footer>
    <div class="actions">
      <button
        pButton
        type="button"
        label="Ajouter une personne"
        icon="pi pi-plus"
        severity="success"
        aria-label="Ajouter une personne"
        routerLink="/personnes/nouveau"
      >
        Ajouter une personne
      </button>
    </div>
  </ng-template>
</p-card>
